services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: siga_planificaciones
    ports:
      - '5432:5432'
    volumes:
      - siga_pg_data:/var/lib/postgresql/data

volumes:
  siga_pg_data:
